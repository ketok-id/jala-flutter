name: jala_grpc
description: >
  gRPC ClientInterceptor for Jala: unary and streaming RPC capture with
  service/method, messages, status codes and trailers. Capture only —
  mocking and throttling do not apply to gRPC.
version: 0.8.2
homepage: https://github.com/ketok-id/jala-flutter
repository: https://github.com/ketok-id/jala-flutter
issue_tracker: https://github.com/ketok-id/jala-flutter/issues
topics:
  - network
  - debugging
  - devtools
  - grpc

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  grpc: ^5.1.0
  jala_core: ^0.8.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
